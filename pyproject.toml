[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "everrun-agent"
version = "0.1.0"
description = "Durable mission continuity primitives for autonomous AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "UcelX"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
everrun = "everrun_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/everrun_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/everrun_agent"]
