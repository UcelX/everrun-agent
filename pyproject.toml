[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "everrun-agent"
version = "0.1.0"
description = "Durable mission continuity for AI agents: verified state, safe recovery, no duplicate side effects."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "UcelX"}]
keywords = [
  "ai-agents",
  "durable-execution",
  "checkpointing",
  "crash-recovery",
  "idempotency",
  "mcp",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1,<2"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "mcp>=1,<2"]

[project.scripts]
everrun = "everrun_agent.cli:main"
everrun-mcp = "everrun_agent.mcp_server:main"

[project.urls]
Homepage = "https://github.com/UcelX/everrun-agent"

[tool.hatch.build.targets.wheel]
packages = ["src/everrun_agent"]
artifacts = [
  "src/everrun_agent/py.typed",
  "src/everrun_agent/integrations/hermes/SKILL.md",
]

[tool.hatch.build.targets.sdist]
exclude = [".venv", "dist", "build", ".mypy_cache", ".pytest_cache", ".ruff_cache"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/everrun_agent"]
