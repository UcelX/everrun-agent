name: ci
on: [push, pull_request]
jobs:
  quality:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '${{ matrix.python }}'}
      - run: python -m pip install -e '.[dev]' build
      - run: pytest -q
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: mypy src/everrun_agent
      - run: python -m build
  mcp-unsupported-major:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'mcp>=2' || true
      - run: python -m pip install -e '.[mcp]' --dry-run
        # Resolver must reject MCP 2.x or select a compatible 1.x; pyproject pins >=1,<2.
