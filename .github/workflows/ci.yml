name: ci
on: [push, pull_request]
jobs:
  quality:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '${{ matrix.python }}'}
      - run: python -m pip install -e '.[dev]' build
      - run: pytest -q
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: mypy src/everrun_agent
      - run: python -m build
  mcp-unsupported-major:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Supported MCP 1.x dependency must resolve cleanly
        run: python -m pip install -e '.[mcp]'
      - run: python -m pip check
      - name: Simultaneous MCP 2.x requirement must be rejected by the resolver
        shell: bash
        run: |
          if python -m pip install -e '.[mcp]' 'mcp>=2'; then
            echo "ERROR: resolver accepted incompatible MCP 1.x and 2.x requirements"
            exit 1
          fi
          exit 0
